baseURL: "https://lsext.org/"
title: "Legacy SPARC Extentions"
theme: "hugo-PaperMod"

# Simple single-language configuration
languageCode: "en"
defaultContentLanguage: "en"

outputs:
  home:
    - HTML
    - RSS
menu:
  main:
    - name: Home
      url: /
      weight: 10
    - name: Posts
      url: /posts/
      weight: 20
    - name: Packages
      url: https://github.com/LSExt/lsesol/releases/download/v0.9.0-sol25-sparc/autoconf-2.69-1.lse-sunos5.5.1-sparcv7-lse.gz/
      weight: 30
    - name: "About"
      url: "/about/"
      weight: 40
    - name: Legacy Site
      url: http://legacy.lsext.org
      weight: 50

params:
  cover:
     responsiveImages: false
     linkFullImages: false
  author:
     name: "Luis Enrique Limon"
  env: "production"
  description: "A simple retro-compatible Hugo site"
  packageBaseUrl: "http://lsext.org/packages"
  # packageBaseUrl: "https://github.com/luiselimon/my-repo/releases/download/v1.0.0-sparc"
  
  # Retro / Fallback settings
  defaultTheme: "light"
  disableThemeToggle: true
  ShowSearch: false
  ShowShareButtons: false
  ShowReadingTime: false
  disableSpecial1stPost: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowToc: false
